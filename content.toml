# ---------------------------------------------------------------------
# Plain language notes shown above the map, one per indicator.
# Keep each under 100 words. The first sentence says what the
# technology is, the second says why it matters.
# ---------------------------------------------------------------------
[glosses]
BRRI_CORE28_29 = "<b>BR-28 and BR-29</b> are the two IRRI derived Boro season rice varieties released by BRRI in the 1990s. They remain the workhorse of Bangladesh's dry season rice and are what farmers usually grow when irrigation is available."
BRRI_NEW_POST2012 = "<b>BR-70 and above</b> are the BRRI lines released after 2012, for example BR-89 and BR-92, which are high yielding aromatic Boro varieties. Their share shows how quickly newer public varieties are replacing BR-28 and BR-29."
BRRI_STRESS = "<b>Stress tolerant BRRI varieties</b> are bred to survive flooding (BR-47, BR-51), drought (BR-66) or salinity (BR-67), or to add zinc to the grain (BR-62, BR-64). They matter most in coastal and flood prone districts."
BRRI_OLDER_HYV = "<b>Older BRRI high yielding varieties, BR-1 to BR-69,</b> are public varieties released before 2000, and many are still widely grown in the Aman and Aus seasons. A rising share suggests older lines are persisting, while a falling share suggests they are being displaced."
HYBRID = "<b>Hybrid rice</b> is F1 seed, mostly imported or produced by private firms. Farmers must buy fresh seed every season, so adoption tracks input markets as much as agronomy."
BINA = "<b>BINA varieties (Binadhan)</b> come from the Bangladesh Institute of Nuclear Agriculture. The best known is flood tolerant Binadhan-11, grown in haor and flash flood districts."
LOCAL = "<b>Local landraces</b> are traditional, often single season varieties grown from saved seed. Their share indicates where modern varieties have not yet displaced informal seed systems."
RICE_GROWER = "<b>Any rice grower</b> is the share of agricultural households that grew any rice at all in the round. It is the baseline against which every variety family can be compared."
ANY_POND = "<b>Any cultivated fish pond</b> is the entry point for every aquaculture indicator. Without a cultivated pond, none of the species level shares can be positive."
TILAPIA = "<b>Tilapia, including GIFT</b> (Genetically Improved Farmed Tilapia), is the flagship aquaculture innovation of WorldFish and CGIAR, and it dominates Bangladesh's commercial fish ponds."
POLY_CARP_2PLUS = "<b>Carp polyculture with two or more species</b> is the intensification path promoted by CGIAR. Stocking several carp species in the same pond raises pond productivity above single species culture."
CARP_ANY = "<b>Any carp</b> means at least one carp species is present in a cultivated pond, regardless of the stocking pattern."
MOLA = "<b>Mola co-culture</b> stocks small indigenous fish alongside carp for household nutrition. Mola is exceptionally rich in vitamin A, iron and zinc, and the practice is a nutrition focused WorldFish innovation."
PRAWN_GALDA = "<b>Galda, the freshwater prawn,</b> is a high value export species concentrated in the southwest."
SHRIMP_BAGDA = "<b>Bagda, the brackish water shrimp,</b> is concentrated in the coastal southwest belt where saline water permits cultivation."
POWER_TILLER = "<b>The power tiller</b> is a two wheel tractor. It is the dominant machine for land preparation on Bangladesh's small farms."
TRACTOR = "<b>The four wheel tractor</b> is far less common than the power tiller on smallholder farms."
POWER_THRESHER = "<b>The power thresher</b> is motor driven post harvest threshing equipment. It was the main mechanised step before combined harvesters became widely available."
SPRAYER = "<b>The motorised sprayer</b> was the fastest growing piece of farm machinery in the 2024 round. It is used for pesticides, herbicides and foliar fertiliser."
REAPER = "<b>The reaper</b> is a motorised crop cutting machine. Adoption remains concentrated in a few districts."
COMBINED_HARVEST = "<b>The combined harvester</b> cuts, threshes and cleans grain in one pass. It remains rare because it is expensive and built for larger plots than most Bangladeshi farms."

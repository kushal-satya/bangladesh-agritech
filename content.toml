# =====================================================================
# MIXTAPE dashboard content and theme
# =====================================================================
# Every piece of narrative text and every color on the dashboard lives
# in this file. Edit the text or the colors here, then rebuild with:
#
#     python build_dashboard.py
#
# The build reads the data files in data/ and writes index.html.
# Text values may contain simple HTML tags such as <b>, <em> and <a>.
# Strings wrapped in triple quotes may span several lines.
# =====================================================================

# ---------------------------------------------------------------------
# Page identity
# ---------------------------------------------------------------------
[page]
title = "MIXTAPE: Bangladesh CGIAR rice and aquaculture technologies"
eyebrow = "CGIAR Standing Panel on Impact Assessment, country study"
heading = "Monitoring Impacts for Technology Adoption and Program Engagement in Bangladesh"
meta_left = "Household level evidence on CGIAR linked rice and aquaculture innovations"
meta_right = "Four BIHS rounds: <b>2011/12, 2015, 2018/19, 2024</b>"
brief = """MIXTAPE tracks how publicly bred rice varieties, aquaculture practices, and farm machinery have spread across Bangladesh's farming households between 2011 and 2024, using four rounds of the nationally representative BIHS panel. Each map and chart shows the share of farmers using a particular technology, by district and over time. Cornell University and Bangladesh Agricultural University run the study. CGIAR's Standing Panel on Impact Assessment (SPIA) funds it through 2027."""

# ---------------------------------------------------------------------
# Side rail
# ---------------------------------------------------------------------
[rail]
brand_acronym = "MIXTAPE"
brand_subtitle = "Bangladesh country study"
panel_label = "BIHS panel, all rural households"
agri_label = "Agricultural households, analysis frame"
note = "All percentages on this dashboard are weighted shares of the agricultural sub-frame, that is, households that cultivated land or operated a pond. The full BIHS panel covers all rural households."
contact_name = "Kushal Kumar"
contact_email = "kd475@cornell.edu"
contact_affiliation = "Cornell University"
replication_text = "Recomputed alongside"
replication_link_label = "SPIA Bangladesh Study 2025"
replication_link_url = "https://github.com/CGIAR-SPIA/SPIA-Bangladesh-Study-2025"

# One row per BIHS round: [round label, sample size]
panel_rows = [
  ["2011/12", "6,503"],
  ["2015", "6,715"],
  ["2018/19", "6,011"],
  ["2024 SPIA", "5,554"],
]
agri_rows = [
  ["2011/12", "3,755"],
  ["2015", "3,723"],
  ["2018/19", "3,220"],
  ["2024 SPIA", "2,924"],
]

# ---------------------------------------------------------------------
# Tab names, in display order. Do not change the id values.
# ---------------------------------------------------------------------
[[tabs]]
id = "t-map"
label = "Map overview"

[[tabs]]
id = "t-rice"
label = "Rice"

[[tabs]]
id = "t-aqua"
label = "Aquaculture"

[[tabs]]
id = "t-spia"
label = "2024 SPIA round"

[[tabs]]
id = "t-mech"
label = "Mechanisation"

[[tabs]]
id = "t-tech"
label = "Technology index"

# ---------------------------------------------------------------------
# Tab 1: Map overview
# ---------------------------------------------------------------------
[map]
heading = "What has changed in the four-round BIHS panel, 2011/12 to 2024"
lede = """Three broad shifts stand out in CGIAR linked technology adoption: the Boro rice varieties that farmers plant, the number of households that keep fish ponds, and the degree of mechanisation in paddy production. Every figure on this dashboard is a weighted share of <b>agricultural households</b>, meaning those that cultivated land or operated a pond in the recall period (n = 2,924 in 2024). The underlying BIHS panel surveys <b>all rural households</b> (n = 5,554 in 2024) whether or not they farm. Read the note on comparability below before quoting any figure against the published SPIA report."""
map_heading = "District map: pick a category, an indicator, and a round"
map_lede = """Each of Bangladesh's 64 districts is shaded by the share of agricultural households using the selected indicator. <b>Darker shades mean a higher share.</b> Hover over any district to see its weighted rate. The summary figures above the map, the district rankings beside it, and the national trend lines below all follow the indicator you pick."""
trend_heading = "How the national rate has moved, 2011 to 2024"
trend_lede = "Each line is the weighted national share of agricultural households for one variety family or aquaculture practice across the four BIHS rounds."
note = """Denominator: agricultural households, meaning those that cultivated land or operated a pond in the recall period, weighted with each round's BIHS sampling weights. The analytic frame holds 3,755 / 3,723 / 3,220 / 2,924 households across the four rounds, while the underlying BIHS panel ran 5,503 to 6,715 households per round. Frame definitions follow the SPIA Bangladesh Study 2025; the full citation appears on the 2024 SPIA round tab. Mechanisation indicators for 2011 and 2015 are limited to a single harmonised tractor flag. Richer equipment rosters exist only for 2018/19 (module D2) and 2024 (modules a5_6 and d2)."""
category_pills = [["rice", "Rice variety"], ["aqua", "Aquaculture"], ["mech", "Machinery / pumps"]]
info_title = "Bangladesh, weighted mean"
info_hover_hint = "Hover any district for its share"
legend_units = "% of households"
gloss_suffix = "The map shows the weighted share of agricultural households in each district where this indicator applies, {year}. Darker shades mean a higher share."
kpi_national = "National share, {year}"
kpi_change = "Change at the national level"
kpi_highest = "Highest district"
kpi_lowest = "Lowest district"
top_list_label = "Highest adoption (top 5 districts)"
bottom_list_label = "Lowest adoption (bottom 5 districts)"

[method]
summary = "How to read these numbers, and how they differ from the published SPIA report"
body = """The BIHS panel <b>surveys all rural households</b> in the Feed the Future zone, whether or not they farm. This dashboard restricts to the <b>agricultural sub-frame</b>, meaning households that cultivated land or operated a pond in the recall period, and roughly half of the panel falls in that sub-frame each round.
<br><br>
<b>These figures are an independent recomputation from the BIHS microdata, not a reproduction of the published SPIA tables.</b> The dashboard applies one denominator, agricultural households, to every indicator so that technologies can be compared with one another and across the four rounds. The SPIA Bangladesh Study 2025 instead selects a denominator suited to each innovation: Boro rice-growing households for rice varieties, fish-cultivating households for individual species, and agricultural households excluding aquaculture-only households for machinery. Rice is where that difference bites hardest. The report works with roughly 1,733 Boro rice-growing households in 2024 against the 2,924 agricultural households used here, so every rice percentage on this dashboard is correspondingly lower than the matching figure in the report.
<br><br>
Sample counts also differ. This dashboard reports the BIHS panel as delivered in the microdata, which includes the Feed the Future booster, while the report works from the nationally representative core of roughly 5,500 households per round. The two agree exactly for 2024, at 5,554. <b>Cite the SPIA report rather than this dashboard for official reach estimates.</b>"""
caption = """Weights: BIHS_FTF baseline 2011/12, BIHS FTF 2015 sampling weights, 158_BIHS r3 weights, SPIA 2024 hhweight_24. Source: <a href="https://github.com/CGIAR-SPIA/SPIA-Bangladesh-Study-2025" target="_blank" rel="noopener">SPIA Bangladesh Study 2025 replication code</a>. Full project context sits in tab 04 (2024 SPIA round) and tab 06 (Technology index)."""
# One entry per round: [round label, full panel, agricultural sub-frame]
denominators = [
  ["2011/12", "6,503 panel households", "3,755 agricultural"],
  ["2015", "6,715 panel households", "3,723 agricultural"],
  ["2018/19", "6,011 panel households", "3,220 agricultural"],
  ["2024 SPIA", "5,554 panel households", "2,924 agricultural"],
]


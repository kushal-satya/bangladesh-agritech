# =====================================================================
# THEME
# Anchored to the CGIAR SPIA house palette (teal #07555F, dark green text,
# no rounded corners). One accent, used sparingly; everything else neutral.
# =====================================================================
[theme]
accent = "#07555F"         # SPIA teal: links, active nav, the highlighted series
accent_dark = "#054047"    # hover and emphasis shade
ink = "#0f2e28"            # headings and figures
text = "#1f3a34"           # body text, a desaturated dark green rather than black
mute = "#5d726c"           # captions, axis labels, secondary text
chart_text = "#5b5b5b"     # chart tick and legend text
line = "#e4e9e7"           # hairline rules, the main structural device
line2 = "#b9c4c1"          # stronger rules, control outlines
background = "#ffffff"     # page background
tint = "#f4f7f6"           # row hover only
chart_grid = "#dddddd"     # chart grid lines, drawn dashed
positive = "#07555F"       # an increase
negative = "#8c3a22"       # a decrease
map_nodata = "#ececec"     # districts with no data in the round

# Chart series, in order. The first entry is the highlighted series and takes
# the accent; the rest are greys so that one line reads first.
series = ["#07555F","#3c3c3c","#6f6f6f","#949494","#b0b0b0","#c6c6c6","#d8d8d8","#4a7f86","#5a5a5a","#a3a3a3"]

# Map colour ramp: pairs of [upper bound in %, hex]. A district falls in the
# first band whose bound is at or above its value. One ramp serves every
# indicator so a given shade always means the same thing.
map_ramp = [[0,"#e3ecec"],[2,"#c2d6d8"],[5,"#9bbcc0"],[10,"#6fa0a6"],[20,"#428289"],[35,"#1d666f"],[100,"#07444c"]]

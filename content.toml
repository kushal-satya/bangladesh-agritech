# =====================================================================
# THEME
# All colors on the dashboard. Values are standard CSS hex colors.
# =====================================================================
[theme]
ink = "#1a1f1c"            # darkest text, headings
text = "#2b332e"           # body text
mute = "#6c7570"           # secondary text
chart_text = "#4a5550"     # chart axis and legend text
line = "#e3e6e1"           # hairline borders
line2 = "#cfd4cd"          # stronger borders, control outlines
background = "#fafaf7"     # page background
panel = "#ffffff"          # card background
tint = "#f3f5f0"           # subtle fill for hover states and notes
rail_background = "#fbfbf8"# side rail background
chart_grid = "#eef0eb"     # chart grid lines
positive = "#2f6b3a"       # upward change
negative = "#9c3a2a"       # downward change
map_nodata = "#ebede8"     # districts with no data
map_stroke = "#ffffff"     # district outline on the map

# Category accents. main is the primary color, dark the hover and
# emphasis shade, soft the pale background tint, light the secondary
# chart shade.
[theme.rice]
main = "#2d6a4f"
dark = "#1c4a36"
soft = "#e5ede7"
light = "#6c9971"

[theme.aqua]
main = "#1f5e8a"
dark = "#163f5d"
soft = "#dfe9f1"
light = "#6996ad"

[theme.mech]
main = "#7a6147"
dark = "#52402b"
soft = "#ece4d6"
light = "#bdaa7f"

# Chart series palettes, darkest first. Lines in multi-series charts
# take these colors in order.
[theme.series]
rice = ["#1c4a36","#2d6a4f","#467a52","#6c9971","#94b696","#b9cbb0","#dde6dd","#0f3624","#5d8a4d","#3f5e2c"]
aqua = ["#0e3a5c","#163f5d","#1f5e8a","#3f7896","#6996ad","#94b3c4","#bccfd9","#5198c7","#1c4a36","#52402b"]
mech = ["#332617","#52402b","#7a6147","#9c885c","#bdaa7f","#d6c8a8","#ece4d6","#a3866c","#5e5340","#8a7253"]

# Map color ramps: pairs of [upper bound in %, hex color]. A district
# falls in the first band whose bound is at or above its value. The
# lightest step must stay visible against the page background.
[theme.map_ramps]
rice = [[0,"#dde6dd"],[2,"#bcd0bd"],[5,"#94b696"],[10,"#6c9971"],[20,"#467a52"],[35,"#285e3d"],[100,"#143f27"]]
aqua = [[0,"#dee6ec"],[2,"#bccfd9"],[5,"#94b3c4"],[10,"#6996ad"],[20,"#3f7896"],[35,"#1f5e8a"],[100,"#0e3a5c"]]
mech = [[0,"#ece4d6"],[2,"#d6c8a8"],[5,"#bdaa7f"],[10,"#9c885c"],[20,"#7a6147"],[35,"#54402b"],[100,"#332617"]]

# ---------------------------------------------------------------------
# Tab 2: Rice
# ---------------------------------------------------------------------
[rice]
heading = "Rice variety adoption, 2011 to 2024"
lede = """Rice varieties are coded round by round from module H1 (2011, 2015, 2019) and from the 2024 paddy modules c2_4 (main paddy) and b6 (seedbed). Each household's set of grown varieties is classified into one of seven CGIAR relevant families, and we then compute the weighted share of households growing a family."""
district_heading = "District-level prevalence, by variety family (2024)"
top_heading = "Top districts: BRRI core (BR-28 / BR-29) and new BRRI lines (BR-70 and above), 2024"
full_heading = "Full district level table: every variety family, all 64 districts, all rounds"
full_lede = """Pick a round below. Every cell is a weighted share (%) of households in that district who grew a variety in the family. <span class="src">n (households)</span> is the unweighted sample size and <span class="src">Σ weight</span> is the sum of household sampling weights, which is the denominator used to compute each percentage. Use the search box to filter, click any header to sort, and use the CSV button to export the full table for that round."""
note = """Source: BIHS 011_mod_h1_male.dta, 015_r2_mod_h1_male.dta, 021_bihs_r3_male_mod_h1.dta, SPIA_BIHS_2024_module_c2_4.dta and module_b6.dta. Weights: BIHS_FTF baseline sampling weights, BIHS FTF 2015 survey sampling weights, 158_BIHS sampling weights_r3.dta, SPIA 2024 hhweight_24."""
top_table_1 = "Top 10 districts: BR-28 / BR-29 (2024)"
top_table_2 = "Top 10 districts: new BRRI lines, BR-70 and above (2024)"

# ---------------------------------------------------------------------
# Tab 3: Aquaculture
# ---------------------------------------------------------------------
[aqua]
heading = "Aquaculture adoption, 2011 to 2024"
lede = """Pond level rosters (module L1 in earlier rounds, e5 and e10 in 2024) are filtered to ponds with positive cultivated area. For every household with at least one cultivated pond we record the fish species present, then compute the weighted share of all agricultural households showing each indicator. Households without a pond count as zero rather than being dropped, so the species shares sit inside the pond ownership share and are not conditional on keeping a pond."""
district_heading = "District-level pond prevalence (2024)"
top_heading = "Top pond-intensive and tilapia-intensive districts, 2024"
full_heading = "Full district level table: every aquaculture indicator, all 64 districts, all rounds"
full_lede = """Weighted share (%) of households in each district showing the indicator, filtered to ponds with positive cultivated area. The 2024 round additionally records intensification practices: supplementary feed, hormone use, and disease control. Sort on any column, filter by district, or export a CSV for the round on display."""
note = """Source: BIHS 026_mod_l1_male.dta, 037_r2_mod_l1_male.dta, 051_bihs_r3_male_mod_l1.dta, SPIA_BIHS_2024_module_e5.dta and module_e10.dta. Species codes come from the value labels in each file."""
top_table_1 = "Top 10 pond-intensive districts (2024)"
top_table_2 = "Top 10 tilapia districts (2024)"

# ---------------------------------------------------------------------
# Tab 4: 2024 SPIA round
# ---------------------------------------------------------------------
[spia]
heading = "2024 SPIA round: new insights"
lede = """The 2024 SPIA round adds three pieces of evidence on top of the traditional recall based BIHS instrument: (i) DNA fingerprinting of sampled paddy plots, which allows direct rather than self reported variety identification, and of which this tab shows the hybrid-excluded subset of 370 samples; (ii) a detailed agricultural equipment ownership roster; (iii) explicit aquaculture intensification practices, namely supplementary feed, hormone use, and disease control."""
dna_heading = "DNA-fingerprint varieties in the hybrid-excluded subset (370 samples, 10 clusters)"
dna_lede = """These are genotyped varieties rather than self reports, each matched against a reference library. The file used here is the hybrid-excluded cluster release from the SPIA replication package, covering 370 samples in 10 genetic clusters. The full fingerprinting exercise described in the report is considerably larger, so treat this tab as a subset rather than as the complete DNA evidence. BR-28 and BR-29 together account for <span id="dnaBoroPct"></span>% of this subset, the largest share held by any pair of named BRRI releases, although locally named aromatic types such as Jira, Miniket and Katari account for more in aggregate."""
practices_heading = "Aquaculture intensification practices (household weighted, 2024)"
practices_lede = "Measured at the household level in the 2024 e10 module."
equipment_heading = "Equipment ownership roster (module a5_6)"
full_heading = "Full 2024 district level table: every rice, aquaculture and mechanisation indicator"
full_lede = """All indicators measured in the 2024 SPIA round, pooled into a single wide table at the district level. Rows sort and filter, and the CSV download exports every column."""
dna_variety_heading = "Variety counts in the hybrid-excluded subset (n = 370 samples)"
dna_variety_lede = "Raw count of samples matched to each reference variety, in descending order."
dna_cluster_heading = "Genetic clusters (10 clusters)"
dna_cluster_lede = """Each sample was assigned to a cluster by its genotype. The table shows sample counts per cluster, the number of distinct varieties observed in the cluster, and the cluster's most frequent variety."""
note = """Source: SPIA_BIHS_2024_module_a1.dta, a5_6.dta, c2_4.dta, b6.dta, e5.dta, e10.dta, d2.dta, and ref_clusters_no_hybrids_with_HH_Ids.csv (DNA fingerprints)."""

[spia.reference]
eyebrow = "Source for this tab"
title = "SPIA Bangladesh Study 2025: Updating the Green Revolution"
citation = "Singla, S., Ul Islam, T., Hassan, F., Monteiro, I., Stevenson, J., Emerick, K. (2025). Standing Panel on Impact Assessment (SPIA), Rome. CC BY-NC-SA 4.0."
report_label = "Read the SPIA 2025 report (PDF)"
report_url = "https://iaes.cgiar.org/sites/default/files/pdf/SPIA_Bangladesh_Study_2025.pdf"
github_label = "SPIA replication repository on GitHub"
github_url = "https://github.com/CGIAR-SPIA/SPIA-Bangladesh-Study-2025"
note = """The 2024 SPIA round of BIHS, the DNA fingerprint sample, the equipment roster and the aquaculture intensification module on this tab are taken from SPIA's published 2025 study. This dashboard presents and verifies a subset of that evidence in a navigable form."""

# ---------------------------------------------------------------------
# Tab 5: Mechanisation
# ---------------------------------------------------------------------
[mech]
heading = "Mechanisation and agricultural practices, 2018/19 and 2024"
lede = """Ownership and use are different things here, and the gap between them is the main finding. Fewer than three percent of agricultural households owned a power tiller in 2024, while about sixty-five percent used motorised threshing. That gap points to rental and custom-hire markets rather than household ownership. Ownership for 2018/19 comes from the round 3 asset roster (module D2) and for 2024 from SPIA module a5_6. The two instruments enumerate equipment differently, so movements between those rounds are indicative rather than a clean trend, and the sharp jumps in sprayers and threshers are at least partly a change in how the question was asked."""
district_heading = "District-level mechanisation (2024)"
full_heading = "Full district level table: every piece of equipment, all rounds with data"
full_lede = """Weighted share (%) of households owning each piece of equipment and, for 2024, actually <em>using</em> motorised harvest or threshing. The 2011 and 2015 rounds carry only a tractor flag in the harmonised file, so those columns are filled only where microdata exist."""
note = """Sources: 016_bihs_r3_male_mod_d2.dta (round 3 asset roster; codes 12 tractor, 13 power tiller, 15 thresher, 22 LLP pump, 25 electric motor pump, 26 diesel pump, 27 sprayer, 28 reaper, 36 axial flow pump, 37 seeder drill, 39 combined harvester); SPIA_BIHS_2024_module_a5_6.dta (binary ownership indicators); SPIA_BIHS_2024_module_d2.dta (actual motorised use). Ownership in 2011 and 2015 draws on the limited set of durable asset flags in BIHS_household_2011_15.dta (asset_tractor only)."""

